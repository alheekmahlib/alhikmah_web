# النشر التلقائي إلى Cloudflare Workers (حساب ahmedlabtop4).
# يتطلب تعريف سرّين في إعدادات المستودع على GitHub:
#   CLOUDFLARE_API_TOKEN   توكن من حساب Cloudflare المستهدف (صلاحيات Workers Scripts:Edit + Account Settings:Read + Workers R2 Storage:Edit)
#   CLOUDFLARE_ACCOUNT_ID  معرّف الحساب المستهدف (من صفحة Workers في اللوحة، الشريط الجانبي الأيمن)
# قبل أول نشر يجب أن تكون حاوية R2 موجودة في نفس الحساب:
#   npx wrangler r2 bucket create alhikmah-opennext-cache

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 يرفق npm 11 المطابق لإصدار npm الذي وُلّد به package-lock.json؛
          # npm 10 (المرفق مع Node 22) يرفض التبعيات الاختيارية المتداخلة (@esbuild/*).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (OpenNext for Cloudflare)
        run: npm run build
        env:
          NEXT_PUBLIC_QURAN_IFRAME_URL: https://alhikmah-quran.haozo89.workers.dev
          NEXT_PUBLIC_SITE_URL: https://alhikmah.ahmedlabtop4.workers.dev

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
